<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>EZWrite6 AI Agent</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Roboto:wght@400;500&display=swap">
<style>
/* 舞台 1920×1080 依 Figma 原尺寸刻，JS 等比縮放；畫布用 Figma 匯出底圖，AI 視窗為可互動 HTML */
:root {
  --page: #eceef2; --panel: #ffffff; --ink: #23262f; --ink-soft: #5e6372; --rule: #d8dbe3; --accent: #4a6ee4;
  --text: #595959; --hint: #6a6a6a; --strong: #424242; --supporting: #3e5ec7; --disabled: rgba(89,89,89,.3);
  --subtle: #f1f1f1; --selected: rgba(74,110,228,.15); --hover: #f6f8fe; --list-hover: rgba(165,183,242,.10);
  --sep: #cdcdcd; --primary: #4a6ee4; --primary-pressed: #3e5ec7; --outlined: #6a6a6a;
  --red1: #feede9; --red: #d71a09; --violet: #713dff; --violet2: #efe8ff; --muted: #8f9090;
  --cjk: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --latin: "Roboto", "Noto Sans TC", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #15171d; --panel: #1f222b; --ink: #eceef4; --ink-soft: #a4a9b8; --rule: #2f3341; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #15171d; --panel: #1f222b; --ink: #eceef4; --ink-soft: #a4a9b8; --rule: #2f3341; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--cjk); }
.wrap { max-width: 1760px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 20px; align-items: start; }
@media (max-width: 1000px) { .wrap { grid-template-columns: minmax(0,1fr); } }
.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.top h1 { margin: 0; font-size: 1.4rem; text-wrap: balance; }
.top p { margin: 4px 0 0; color: var(--ink-soft); font-size: .88rem; line-height: 1.55; max-width: 80ch; }
.tools { display: flex; gap: 8px; }
.tools button { font: inherit; font-size: .82rem; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.tools button:hover { border-color: var(--accent); }
.outer { width: 100%; aspect-ratio: 16/9; position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); background: #d9d9d9; }
.outer:fullscreen { border-radius: 0; background: #000; }
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; color: var(--text); font-family: var(--cjk); overflow: hidden; }
.bg { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; user-select: none; }
/* AI 編輯中鎖定區：微光由左到右掃過（位置對齊 Figma ai-editing-lock） */
.sweep { position: absolute; border-radius: 8px; overflow: hidden; pointer-events: none; opacity: 0; transition: opacity .4s; }
.sweep.on { opacity: 1; }
.sweep[hidden] { display: none; }
/* 掃光調輕：細一點的半透明白光、慢一點；外圈只留淡淡的呼吸光暈，不加底色 */
.sweep::after { content: ""; position: absolute; top: -10%; bottom: -10%; left: 0; width: 28%; background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.32) 50%, rgba(255,255,255,0) 100%); animation: sweep 2.6s ease-in-out infinite; }
@keyframes sweep { from { transform: translateX(-120%); } to { transform: translateX(380%); } }
.sweep.on { animation: lockPulse 2.4s ease-in-out infinite; }
@keyframes lockPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(74,110,228,0), 0 0 8px rgba(74,110,228,.12); }
  50% { box-shadow: 0 0 0 2px rgba(74,110,228,.18), 0 0 20px rgba(74,110,228,.22); }
}
@media (prefers-reduced-motion: reduce) { .sweep::after { animation: none; opacity: 0; } .sweep.on { animation-duration: 4s; } }
/* 視窗內捲軸：白色軌道＋灰色圓角滑塊 */
.stage { color-scheme: light; }
.stage * { scrollbar-width: thin; scrollbar-color: #8f9090 #fff; }
.stage *::-webkit-scrollbar { width: 8px; height: 8px; background: #fff; }
.stage *::-webkit-scrollbar-track { background: #fff; border-radius: 4px; }
.stage *::-webkit-scrollbar-thumb { background: #8f9090; border-radius: 4px; border: 1px solid #fff; }
.stage *::-webkit-scrollbar-corner { background: #fff; }
.ai-hot { position: absolute; left: 445px; top: 990px; width: 60px; height: 60px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; }
/* 底圖烤進了藍色外圈：default 用白邊蓋掉，只有滑鼠 hover 時才露出藍圈；點開後滑鼠移開即消失 */
.ai-hot::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 12px solid #fff; transition: opacity .15s; pointer-events: none; }
.ai-hot:hover::before { opacity: 0; }
.ai-hot:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); }
.dialog { position: absolute; left: 704px; top: 390px; width: 512px; height: 300px; background: #fff; border-radius: 12px; display: grid; grid-template-rows: 1fr auto; padding: 0 0 40px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.dialog p { margin: 0; align-self: center; text-align: center; font-size: 18px; color: var(--text); }
.dialog .row { display: flex; justify-content: center; gap: 32px; }
.dialog .btn { width: 168px; height: 56px; font-size: 18px; }

/* AI 視窗 480×805 */
.win { position: absolute; left: 16px; top: 159px; width: 480px; height: 805px; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; background: linear-gradient(180deg, #fff 0%, #f9f9f9 100%); box-shadow: 0 4px 16px rgba(0,0,0,.16); }
.win[hidden] { display: none; }
.head { flex: none; height: 64px; display: grid; grid-template-columns: 40px 1fr 40px; gap: 8px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--sep); }
.head h2 { margin: 0; text-align: center; font: 400 24px/28px var(--latin); color: var(--text); }
.head h2.cjk { font-family: var(--cjk); }
.ib { width: 40px; height: 40px; border: 0; padding: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
.ib:hover { background: #f1f1f1; }
.ib svg { display: block; }
.content { position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
.col { min-height: 100%; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.col::before { content: ""; flex: 1 1 auto; margin-bottom: -16px; }
.col.welcome-mode { justify-content: center; }
.col.welcome-mode::before { display: none; }
.col.list-mode { padding: 16px 16px 24px; gap: 0; }
.col.list-mode::before { display: none; }
.foot { position: relative; flex: none; padding: 8px 24px 16px; display: flex; flex-direction: column; gap: 8px; }
/* 選取／額度提示浮在輸入框上方，不擠壓對話區，首頁內容不會跟著上移 */
.foot .hints { position: absolute; left: 24px; right: 24px; bottom: 100%; display: flex; flex-direction: column; gap: 8px; z-index: 1; }
.col.has-hint { padding-bottom: 80px; }
.disc { text-align: center; font-size: 12px; line-height: 14px; color: var(--hint); }

.welcome { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.welcome h3 { margin: 0; font: 500 24px/29px var(--cjk); color: var(--text); }
.sug { padding: 8px 16px; }
.sug > svg { flex: none; }
.enter { animation: msgIn .32s cubic-bezier(.2,.8,.2,1) both; }
.u.enter { transform-origin: 100% 100%; }
@keyframes msgIn { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.col.leaving .welcome, .col.leaving .sugs { animation: wOut .24s cubic-bezier(.4,0,1,1) both; }
.col.leaving .sugs { animation-delay: .03s; }
@keyframes wOut { to { opacity: 0; transform: translateY(-20px) scale(.97); } }
.col.w-in .welcome, .col.w-in .sugs { animation: msgIn .36s cubic-bezier(.2,.8,.2,1) both; }
.col.w-in .sugs { animation-delay: .06s; }
@media (prefers-reduced-motion: reduce) { .enter, .col.w-in .welcome, .col.w-in .sugs, .col.leaving .welcome, .col.leaving .sugs { animation: none; } }
.btn:disabled:not(.pri) { opacity: .3; cursor: default; background: #fff; }
.sugs { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.sug { width: 432px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--sep); background: #fff; text-align: left; cursor: pointer; font: inherit; color: var(--text); }
.sug:hover { background: var(--hover); }
.sug:disabled { cursor: default; background: #fff; }
.sug:disabled > * { opacity: .3; }
.sug .tx { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.sug b { font: 500 18px/22px var(--cjk); color: var(--text); }
.sug small { font: 400 14px/17px var(--cjk); color: var(--hint); }

.u { align-self: flex-end; max-width: 400px; background: var(--primary); color: #fff; padding: 12px 16px; border-radius: 16px; font-size: 18px; line-height: 22px; white-space: pre-wrap; overflow-wrap: anywhere; }
.a { align-self: flex-start; max-width: 400px; background: var(--subtle); color: var(--text); padding: 12px 16px; border-radius: 16px; font-size: 18px; line-height: 26px; white-space: pre-wrap; overflow-wrap: anywhere; }
.cursor { display: inline-block; width: 2px; height: 20px; background: var(--text); vertical-align: -3px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.r { align-self: flex-start; width: 400px; background: var(--subtle); border-radius: 16px; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; font-size: 18px; line-height: 22px; color: var(--text); }
.r.err { background: var(--red1); }
.r .msg { white-space: pre-wrap; }
.r .emsg { display: flex; gap: 8px; align-items: flex-start; }
.r .emsg svg { flex: none; margin: -4px 0 -4px -3px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.acts.end { justify-content: flex-end; }
.acts.stack { flex-direction: column; align-items: flex-start; }
.btn { height: 44px; padding: 10px 24px; border-radius: 9999px; border: 1.5px solid var(--outlined); background: #fff; color: var(--text); font: 400 18px/22px var(--cjk); cursor: pointer; white-space: nowrap; }
.btn:hover { background: #f4f4f4; }
.btn.pri { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.pri:hover { background: var(--primary-pressed); border-color: var(--primary-pressed); }
.btn.sec { border-color: var(--primary); color: var(--primary); }
.btn.sec:hover { background: var(--hover); }
.btn.pri:disabled { background: #cdcdcd; border-color: #cdcdcd; color: #fff; cursor: default; }
.btn:focus-visible, .lk:focus-visible, .chk:focus-visible, .ib:focus-visible, .sug:focus-visible, .mi:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.lk { border: 0; background: none; font: 400 18px/22px var(--cjk); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 0; padding: 6px 4px 6px 24px; border-radius: 24px; height: 44px; }
.lk:hover { background: rgba(0,0,0,.06); }
.lk.plain { padding: 6px 8px; }
.items { display: flex; flex-direction: column; }
.it { display: flex; align-items: center; gap: 8px; min-height: 37px; cursor: pointer; }
.it.all { justify-content: space-between; border-bottom: 1px solid var(--sep); padding-bottom: 6px; margin-bottom: 6px; cursor: default; }
.it.all .l { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
.chk { width: 30px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; flex: none; }
.chk svg { display: block; }
.status { align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 18px; line-height: 22px; color: var(--hint); }
.spark { animation: spark 1.2s ease-in-out infinite; flex: none; }
@keyframes spark { 0% { transform: scale(.8) rotate(0) } 50% { transform: scale(1) rotate(45deg) } 100% { transform: scale(.8) rotate(90deg) } }
.shimmer { background: linear-gradient(90deg, var(--hint) 0%, var(--hint) 35%, #d0d0d0 50%, var(--hint) 65%, var(--hint) 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0 } to { background-position: 0% 0 } }
.plan { align-self: flex-start; width: 400px; display: flex; flex-direction: column; gap: 12px; }
.plan .task { display: flex; flex-direction: column; gap: 2px; }
.plan .tr { display: flex; align-items: center; gap: 8px; }
.plan .tr b { flex: 1; font: 500 18px/22px var(--cjk); color: var(--text); }
.plan .tr small { font: 400 14px/17px var(--cjk); color: var(--hint); }
.plan .st { padding-left: 32px; font: 400 14px/17px var(--cjk); width: max-content; }
.plan hr { margin: 0; border: 0; border-top: 1px solid var(--sep); }
.plan ol { list-style: none; margin: 0; padding: 0 0 0 2px; display: flex; flex-direction: column; gap: 12px; position: relative; }
.plan ol::before { content: ""; position: absolute; left: 11px; top: 10px; bottom: 10px; width: 2px; background: var(--sep); }
.plan li { position: relative; display: flex; align-items: center; gap: 10px; font: 400 16px/20px var(--cjk); color: var(--hint); }
.plan li svg { flex: none; background: #fff; border-radius: 50%; }
.plan li.cur { color: var(--text); font-weight: 500; }
.hint { display: flex; align-items: center; gap: 8px; height: 48px; padding: 4px 16px; border-radius: 12px; font-size: 16px; color: var(--text); flex: none; }
.hint.sel { background: var(--selected); }
.hint.quota { background: var(--red1); }
.hint .sp { flex: 1; }
.hint .x { width: 28px; height: 28px; border: 0; background: none; padding: 0; border-radius: 50%; cursor: pointer; }
.hint .x:hover { background: rgba(0,0,0,.06); }
.content .hint { width: 432px; align-self: flex-start; }

.cmp { position: relative; width: 432px; border-radius: 16px; padding: 12px 8px 8px 16px; display: flex; flex-direction: column; gap: 4px; background: linear-gradient(#fff,#fff) padding-box, linear-gradient(90deg,#9b70ff 0%,#0ba798 50%,#2096ff 100%) border-box; border: 2px solid transparent; }
.cmp.dis { background: #fff; border: 1px solid rgba(151,151,151,.5); padding: 13px 9px 9px 17px; }
.line { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; padding-right: 8px; max-height: 114px; overflow-y: auto; scrollbar-width: thin; }
.tok { font: 500 18px/22px var(--latin); color: var(--primary); border-radius: 4px; padding: 0 2px; margin-left: -2px; }
.tok.sel { background: var(--selected); }
.param { font: 400 18px/22px var(--latin); color: var(--hint); }
textarea { flex: 1 1 140px; min-width: 0; border: 0; outline: 0; resize: none; padding: 0; margin: 0; background: transparent; font: 400 18px/22.8px var(--cjk); color: var(--text); overflow: hidden; }
textarea::placeholder { color: var(--hint); }
textarea:disabled::placeholder { color: var(--disabled); }
.arow { display: flex; align-items: center; gap: 8px; height: 48px; }
.arow .sp { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 9999px; background: var(--subtle); border: 0; font: 400 16px/19px var(--cjk); color: var(--text); cursor: pointer; }
.chip b { font-weight: 500; }
.cmp.dis .chip { color: var(--disabled); cursor: default; }
.round { width: 48px; height: 48px; border: 0; padding: 0; background: none; border-radius: 50%; cursor: pointer; display: block; }
.round svg { display: block; }
.round:disabled { cursor: default; }
.menu { position: absolute; left: 0; bottom: calc(100% + 16px); width: 432px; height: 380px; background: #fff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.18); padding: 16px 0; display: flex; flex-direction: column; gap: 8px; }
.menu.short { height: auto; }
.menu .mh { padding-left: 24px; font: 400 16px/19px var(--cjk); color: var(--hint); }
.menu .ml { overflow-y: auto; scrollbar-width: thin; }
.mi { width: 100%; height: 71px; padding: 0 32px; border: 0; background: none; text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 4px; cursor: pointer; }
.mi:hover, .mi.on { background: var(--hover); }
.mi b { font: 400 18px/21px var(--latin); color: var(--text); }
.mi small { font: 400 18px/21px var(--cjk); color: var(--supporting); }
.dd { position: absolute; background: #fff; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.18); padding: 8px 0; z-index: 3; }
.dd button { display: block; width: 100%; border: 0; background: none; text-align: left; padding: 10px 20px; font: 400 18px/22px var(--cjk); color: var(--text); cursor: pointer; }
.dd button:hover { background: var(--hover); }
.dd .q { padding: 10px 20px; font: 400 18px/22px var(--cjk); color: var(--text); }
.dd .q small { display: block; font-size: 14px; line-height: 17px; color: var(--hint); }
.dd .q small.warn { color: var(--red); }
.dd .del { color: var(--red); }
.glabel { font: 400 14px/17px var(--cjk); color: var(--hint); padding: 8px 0 8px 20px; }
.hi { position: relative; width: 448px; height: 56px; display: flex; align-items: center; padding: 0 24px; border-radius: 8px; font: 400 18px/21px var(--cjk); color: var(--text); cursor: pointer; }
.hi:hover, .hi.hov { background: var(--list-hover); }
.hi span { flex: 1; }
.hi .ib { width: 32px; height: 32px; }
.empty { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.empty b { font: 500 18px/22px var(--cjk); color: var(--text); margin-top: 8px; }
.empty small { font: 400 14px/17px var(--cjk); color: var(--hint); margin-bottom: 8px; }
.scrolldown { position: absolute; left: 216px; width: 68px; height: 68px; border: 0; padding: 0; background: none; cursor: pointer; }

.tabs { display: flex; gap: 4px; background: color-mix(in srgb, var(--ink) 6%, transparent); border-radius: 999px; padding: 3px; }
.tabs button { flex: 1; font: inherit; font-size: .82rem; border: 0; background: transparent; color: var(--ink-soft); border-radius: 999px; padding: 6px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.nav[hidden] { display: none; }
.flow { border-radius: 10px; }
.flow.on { background: color-mix(in srgb, var(--accent) 9%, transparent); box-shadow: inset 3px 0 0 var(--accent); padding-bottom: 10px; }
.list .flow .ft { display: grid; grid-template-columns: 1fr; gap: 2px; width: 100%; padding: 8px 10px; }
.list .flow .ft b { font-size: .86rem; font-weight: 500; }
.list .flow .ft .ref { font-size: .72rem; color: var(--ink-soft); }
.list .flow .ft[aria-current="true"] { background: transparent; box-shadow: none; }
.how { margin: 0 10px 8px; font-size: .78rem; line-height: 1.55; color: var(--ink); }
.vars { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 10px 8px; }
.list .vars button { display: inline-block; font-size: .74rem; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); }
.list .vars button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.list .again { display: inline-block; margin-left: 6px; font-size: .74rem; color: var(--accent); padding: 2px 4px; }
.rst { justify-self: start; font: inherit; font-size: .78rem; border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.side .sec { padding: 6px 8px 12px; border-bottom: 1px solid var(--rule); }
.side .sec:last-child { border-bottom: 0; }
.side .sec h4 { margin: 6px 0 8px; font-size: .8rem; font-weight: 500; color: var(--ink); display: flex; flex-direction: column; gap: 2px; }
.side .sec h4 small { font-weight: 400; color: var(--ink-soft); font-size: .72rem; }
.side .sec p { margin: 0 0 8px; font-size: .76rem; color: var(--ink-soft); }
.side .sec p b { color: var(--accent); font-weight: 500; }
.chips, .tries { display: flex; flex-wrap: wrap; gap: 4px; }
.list .chips button, .list .tries button { display: inline-block; font-size: .74rem; line-height: 1.3; padding: 5px 10px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); color: var(--ink); cursor: pointer; text-align: left; }
.list .chips button:hover, .list .tries button:hover { border-color: var(--accent); }
.list .chips button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.side .sec p.note { color: var(--ink); line-height: 1.55; }
.tg { font-size: .72rem; color: var(--ink-soft); margin: 8px 0 4px; }
/* 情境清單 */
.side { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; display: flex; flex-direction: column; max-height: calc(100vh - 40px); position: sticky; top: 20px; }
.side .sh { padding: 14px 16px 10px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; }

    case 'clearsel': S.hint = null; S.bg = 'base'; render(); return;

    case 'undo': m.undo = false; S.msgs.push({ t: 'u', text: '復原' }); if (m.revert) S.bg = m.revert; render(); return think(800, () => S.msgs.push({ t: 'a', text: /籃球場/.test(m.text) ? '已回復上一步的變更。需要換成其他球場圖嗎？' : '已回復上一步的變更。' }));
    case 'exp': m.exp = !m.exp; render(); return;
    case 'pick': {
      if (S.busy) return; const v = t.dataset.v; m.answered = true; S.msgs.forEach(x => { if (x.t === 'ok') x.undo = false; });
      if (m.kind === 'group') { S.msgs.push({ t: 'u', text: v }); render(); return doGroup(parseInt(v, 10)); }
      if (m.kind === 'team') { S.msgs.push({ t: 'u', text: v }); render(); return doGroup(parseInt(v, 10), true); }
      if (m.kind === 'course') { S.msgs.push({ t: 'u', text: COURSE_USER[v] || v }); render(); return think(700, () => S.msgs.push({ t: 'multi', text: '要開啟哪些小工具？', items: TOOLS[v], on: TOOLS[v].map(() => true), verb: '開啟', kind: 'tools', course: v })); }
      if (m.kind === 'split') { S.msgs.push({ t: 'u', text: v }); render(); return think(900, () => { S.bg = 'split'; S.winX = 112; ok(v === '3 格' ? '已開啟三分割畫布。' : '已開啟二分割畫布。', 'stickies'); }); }
      S.msgs.push({ t: 'u', text: v }); render(); return think(900, () => ok(`已繪製${v}。`, S.bg));
    }
    case 'cyes': { m.answered = true; const to = m.to || '白'; S.msgs.push({ t: 'u', text: '確定' }); render(); return plan({ title: '批次修改顏色', steps: ['解除 2 張便利貼的鎖定',`更新為${to}色`,'完成並回報結果'], lock: 'bulkLock', done: b => { S.bg = 'stickies'; ok(`已解除鎖定，並將 2 張便利貼更新為${to}色。`, b); } }); }
    case 'cno': m.answered = true; S.msgs.push({ t: 'u', text: '取消' }); render(); return;
    case 'item': m.on[+t.dataset.k] = !m.on[+t.dataset.k]; render(); return;
    case 'all': { const all = m.on.every(Boolean); m.on = m.on.map(() => !all); render(); return; }
    case 'mcancel': m.answered = true; S.msgs.push({ t: 'u', text: '取消' }); render(); return;
    case 'mok': {
      const n = m.on.filter(Boolean).length; m.answered = true; S.msgs.forEach(x => { if (x.t === 'ok') x.undo = false; });
      if (m.kind === 'tools') { S.msgs.push({ t: 'u', text: `開啟 ${n} 項` }); render(); const [img, txt] = COURSE_DONE[m.course]; return think(1000, () => { S.bg = img; ok(txt, 'base'); if (m.course === '小組活動') S.msgs.push({ t: 'single', text: '您要開啟幾分割畫布？', opts: ['2 格','3 格'], short: true, kind: 'split' }); }); }
      if (m.kind === 'gram5') { S.msgs.push({ t: 'u', text: `更正 ${n} 項` }); render(); return think(1000, () => { S.bg = 'gramDone'; ok(`校對完成，共修正 ${n} 處文字。`, m.revertBg); }); }
      S.msgs.push({ t: 'u', text: `更正 ${n} 項` }); render(); return think(1000, () => ok(`校對完成，共修正 ${n} 處文字。`, S.bg));
    }
    case 'retry': S.msgs.splice(i, 1); render(); return route(m.redo);
    case 'nav': if (m.target) { S.bg = m.target; render(); } return;
  }
});
$('aiHot').onclick = () => { S.open = !S.open; render(); };
win.addEventListener('scroll', () => {}, true);
win.addEventListener('wheel', () => { if (S.anchor != null) { S.anchor = null; const tail = $('tail'); if (tail) tail.style.height = '0px'; } }, { passive: true });

/* ---------- 右側：環境開關＋試試看（不會重設畫面） ---------- */
const CANVAS_OPTS = [['base','空白頁'],['stickies','園遊會便利貼 6 張'],['bulkBefore','彩色便利貼（含粉紅）'],['bulkLocked','粉紅便利貼已鎖定'],['gramBefore','文字段落（有錯字）'],['attBefore','含外部連結'],['cls2','只選 2 張便利貼'],['sel','選取 3 個物件']];
const CANVAS_NAME = Object.assign(Object.fromEntries(CANVAS_OPTS), { clsDone: '分群結果頁（第 2/2 頁）', court: '籃球場背景', sumDone: '摘要已加入', groupDone: '4 組討論區', groupTeam: '3 組＋記分板', brainDone: '腦力激盪 8 張', attDone: '連結彙整頁（第 2/4 頁）', attStay: '含外部連結（第 1/4 頁）', clsStay: '園遊會便利貼（第 1/2 頁）', gramDone: '錯字已更正', math: '數學小工具', sci: '自然科學小工具', chi: '國語文小工具', eng: '英文小工具', quiz: '測驗小工具', team: '小組活動小工具', split: '三分割畫布', stickLock: 'AI 編輯中', bulkLock: 'AI 編輯中', gramLock: 'AI 編輯中', attLock: 'AI 編輯中', brainLock: 'AI 編輯中' });
const ENV = [
  ['quotaMode', 'AI 點數', [['ok','充足'],['low','低於 20%'],['last','下一則用完'],['empty','已用完']]],
  ['net', '網路', [['ok','正常'],['off','離線']]],
  ['nextErr', '下一則回應', [[null,'正常'],['parse','解析錯誤'],['halt','任務中斷']]]];
const TRY = [
  ['Skill', ['/', '/group', '/group 10', '/classify', '/summarize', '/grammar-check', '/attachment', '/bulk-edit 把粉紅色便利貼改成白色', '/bulk-edit 把紅色便利貼改成白色', '/bulk-edit 把文字改成粗體', '/bulk-edit']],
  ['能力範圍', ['課堂講解', '腦力激盪', '小組討論', '請幫我開啟分割畫布']],
  ['一般對話', ['請換成籃球場背景', '請檢查這頁有無錯別字', '1 加到 10 =', '請幫我整理這頁便利貼的重點', '什麼是畢氏定理？', '畫一個 80°-60°-40° 的三角形', '請把這頁的便利貼依顏色分組', '（不適宜內容測試）']]];
function syncPanel() {
  $('cv').innerHTML = `目前畫布：<b>${CANVAS_NAME[S.bg] || S.bg}</b>`;
  document.querySelectorAll('[data-canvas]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.canvas === S.bg)));
  document.querySelectorAll('[data-env]').forEach(b => b.setAttribute('aria-pressed', String(String(S[b.dataset.env]) === b.dataset.v)));
}
function setCanvas(k) { S.bg = k; S.hint = k === 'sel' ? 'sel' : null; render(); syncPanel(); }
function setEnv(key, v) {
  S[key] = v === 'null' ? null : v;
  if (key === 'quotaMode') { S.quota = v === 'empty'; S.more = null; if (!S.quota) S.msgs = S.msgs.filter(m => m.t !== 'quota'); }
  render(); syncPanel();
}
function fillTry(t) {
  if (S.view !== 'chat') S.view = 'chat';
  const sk = SKILLS.find(s => t === s[0] || t.startsWith(s[0] + ' '));
  if (sk) { S.skill = sk[0]; S.skillSel = false; S.text = t.slice(sk[0].length).trim(); } else { S.skill = null; S.text = t; }
  S.menuIdx = 0; render(); const ta = $('ta'); if (ta && !ta.disabled) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
$('panel').innerHTML = `<div class="sec"><h4>畫布內容</h4><p id="cv"></p><div class="chips">${CANVAS_OPTS.map(([k, n]) => `<button type="button" data-canvas="${k}">${n}</button>`).join('')}</div></div>`
  + ENV.map(([key, label, opts]) => `<div class="sec"><h4>${label}</h4><div class="chips">${opts.map(([v, n]) => `<button type="button" data-env="${key}" data-v="${v}">${n}</button>`).join('')}</div></div>`).join('')
  + `<div class="sec"><h4>規格備註</h4><p class="note">小工具開啟規則：有小視窗功能的工具，開啟後預設為小視窗，由畫面右上角往下排列（距右 24、距上 64、間距 16）；沒有小視窗的工具以原始尺寸顯示在預設位置；需要使用者先作決定的工具（如記分板選隊伍數）停在選擇畫面。</p></div>`
  + `<div class="sec"><h4>試試看<small>點了會填進輸入框，按 Enter 送出</small></h4>${TRY.map(([g, l]) => `<div class="tg">${g}</div><div class="tries">${l.map(t => `<button type="button" data-try="${esc(t)}">${esc(t)}</button>`).join('')}</div>`).join('')}</div>`;
$('panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.canvas) return setCanvas(b.dataset.canvas);
  if (b.dataset.env) return setEnv(b.dataset.env, b.dataset.v);
  if (b.dataset.try != null) return fillTry(b.dataset.try);
});
$('reset').onclick = () => { clearTimers(); S = fresh(); render(); syncPanel(); };
const _render = render; render = function () { _render(); if ($('cv')) syncPanel(); };
S = fresh(); render(); syncPanel();
})();
</script>
